<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snor's Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        .custom-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            background: url('assets/custom_cursor.png') no-repeat center center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        body:not(.touch-device) {
            cursor: none;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #hacker-overlay, #snow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .hidden {
            display: none !important;
        }

        .controls {
            position: fixed;
            bottom: calc(50% - 240px - 10px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .theme-button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(0, 0, 0, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        .theme-button:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            color: white;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .transparency-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .transparency-icon {
            width: 20px;
            height: 20px;
            color: white;
        }

        .top-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.1);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
            pointer-events: auto;
        }

        @font-face {
            font-family: 'Angel Wish';
            src: url('assets/Angel_wish.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .profile-footer {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        #roblox-widget {
            width: 450px;
            max-width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            color: #f5f5f5;
            backdrop-filter: blur(10px);
        }

        .roblox-avatar-wrapper {
            width: 96px;
            height: 96px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #roblox-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .roblox-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .roblox-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .roblox-display-name {
            font-size: 16px;
            font-weight: 600;
        }

        .roblox-username {
            font-size: 13px;
            color: #aaaaaa;
        }

        .roblox-logo {
            font-size: 10px;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
        }

        .roblox-description {
            font-size: 13px;
            color: #cccccc;
            max-height: 3.2em;
            overflow: hidden;
        }

        .roblox-view-button {
            margin-top: 4px;
            align-self: flex-start;
            padding: 6px 16px;
            border-radius: 999px;
            border: none;
            background: #2a8f4a;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .roblox-view-button:hover {
            background: #33a957;
            transform: translateY(-1px);
        }

        .roblox-view-button:active {
            transform: translateY(0);
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            align-self: flex-start;
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .visitor-icon {
            width: 18px;
            height: 18px;
            color: white;
            opacity: 1 !important;
        }

        .visitor-counter .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            top: -35px;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visitor-counter:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        #visitor-count {
            opacity: 1 !important;
        }

        .social-links {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            margin-top: 0;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon:hover {
            transform: scale(1.4) rotateY(15deg);
        }

        .discord-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .discord-wrapper .tooltip {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #5865F2;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 100;
        }

        .discord-wrapper .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: #5865F2 transparent transparent transparent;
        }

        .discord-wrapper:hover .tooltip {
            opacity: 1;
            visibility: visible;
            bottom: 140%;
        }

        #skills-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
        }

        .skills-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .skill {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .skill-name {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skill-icon {
            width: 22px;
            height: 22px;
            margin-right: 8px;
        }

        .skill-bar-container {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .skill-bar {
            height: 100%;
            border-radius: 5px;
            width: 0%;
            transition: width 2s;
        }

        #python-bar {
            background: linear-gradient(90deg, #ff6b6b, #ff9f9f);
        }

        #cpp-bar {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }

        #csharp-bar {
            background: linear-gradient(90deg, #43e97b, #38f9d7);
        }

        #results-button-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        #results-theme {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        #results-theme:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.8);
        }

        #results-hint {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            width: 180px;
            text-align: center;
            pointer-events: none;
            z-index: 25;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #results-hint::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent rgba(0, 0, 0, 0.8) transparent;
        }

        .home-theme #profile-block,
        .home-theme #skills-block {
            border-color: rgba(200, 200, 200, 0.6);
        }

        .glitch {
            animation: glitch 0.2s ease-in-out;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
            100% {
                transform: translate(0);
            }
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fast-orbit {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        .cursor-trail-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
        }

        #start-text { font-family: 'Special Elite', var(--mono); font-weight: 400; font-size: 26px; letter-spacing: .06em; text-transform: none; color: #fff; }

        @media (max-width: 430px) {

            #profile-block, #skills-block {
                width: 90vw;
                max-width: 350px;
                min-height: 280px;
                padding: 15px;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            .social-links {
                gap: 10px;
                justify-content: center;
            }

            .social-icon {
                width: 32px;
                height: 32px;
            }

            .visitor-counter {
                font-size: 12px;
                padding: 6px 12px;
                align-self: center;
            }

            .visitor-icon {
                width: 16px;
                height: 16px;
            }

            .visitor-counter .tooltip {
                width: 100px;
                font-size: 12px;
                margin-left: -50px;
                top: -30px;
            }

            .skills-title {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .skill-icon {
                width: 18px;
                height: 18px;
            }

            .skill-name span {
                font-size: 14px;
            }

            .controls {
                bottom: 20px;
                gap: 8px;
                padding: 5px 8px;
            }

            .theme-button {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }

            .top-controls {
                top: 10px;
                left: 10px;
                gap: 10px;
                padding: 6px 10px;
            }

            .volume-control, .transparency-control {
                gap: 6px;
            }

            .volume-icon, .transparency-icon {
                width: 18px;
                height: 18px;
            }

            .slider {
                width: 60px;
                height: 4px;
            }

            .slider::-webkit-slider-thumb {
                width: 10px;
                height: 10px;
            }

            #results-button-container {
                top: 10px;
            }

            #results-theme {
                padding: 6px 12px;
                font-size: 12px;
            }

            #results-hint {
                width: 150px;
                font-size: 10px;
                padding: 6px 10px;
            }

            #start-text {
                font-size: 18px;
                padding: 0 20px;
            }
        }
</style>

    <style>

        #profile-block, #skills-block { width: min(580px, 92vw) !important; min-height: 0; margin: 0; }
        #profile-block { padding: 40px 36px 26px; gap: 24px; align-items: center; text-align: center; }
        #skills-block { padding: 36px; }
        .social-links { justify-content: center; }
        #roblox-widget { width: 100%; justify-content: center; text-align: left; }
        .profile-footer { align-items: center; }
        .visitor-counter { align-self: center; margin: 0 auto; width: auto; }

        .whispers { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
        .whispers span {
            position: absolute; font-family: var(--mono); font-weight: 300; font-size: 12px;
            letter-spacing: .28em; color: #fff; white-space: nowrap; opacity: 0; will-change: opacity, filter;
        }
        .dust { position: absolute; inset: 0; z-index: 5; pointer-events: none; width: 100%; height: 100%; }
        .torch { background: radial-gradient(circle var(--r, 380px) at var(--mx) var(--my),
                rgba(0,0,0,0) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,.93) 100%); }

        @media (max-width: 430px) {

    <script>

    (function () {
        var torch = document.querySelector('.torch'), ghost = document.querySelector('.ghost-word');
        var cv = document.querySelector('.dust'), ctx = cv && cv.getContext('2d');
        var spans = [].slice.call(document.querySelectorAll('.whispers span'));
        var plate = document.getElementById('profile-block'), skills = document.getElementById('skills-block');
                if (!torch) return;

        var pool = ['still here', '03:17', 'not everything is lit', 'keep looking', 'you came back',
            'who left the light on', "it's quiet here", 'behind you', 'check the corners', 'this room has no door',
            'the light is yours', 'nothing moved', "you're early", 'wait', 'listen', 'almost', 'stay in the light',
            '11:11', 'it was already open', 'left of center', 'look away', 'so close', 'not yet'];
        var vis = spans.map(function () { return false; });

        var W, H, dpr = Math.min(window.devicePixelRatio || 1, 2), centers = [];
        function center(s) { var r = s.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
        function measure() {
            W = innerWidth; H = innerHeight;
            if (cv) { cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
            centers = spans.map(center);
        }
        measure(); addEventListener('resize', measure); addEventListener('load', measure);
        function pick() {
            var shown = spans.map(function (s) { return s.textContent; }), t, n = 0;
            do { t = pool[Math.floor(Math.random() * pool.length)]; n++; } while (shown.indexOf(t) > -1 && n < 20);
            return t;
        }

        var dust = [];
        for (var i = 0; i < 90; i++) dust.push({ x: Math.random(), y: Math.random(), r: .5 + Math.random() * 1.4, a: .3 + Math.random() * .7, vx: (Math.random() - .5) * .00002, vy: -(.00001 + Math.random() * .00003) });

        var tx = innerWidth / 2, ty = innerHeight * .4, x = tx, y = ty, last = 0, flare = 0, rings = [];
        addEventListener('pointermove', function (e) { tx = e.clientX; ty = e.clientY; last = performance.now(); });
        addEventListener('pointerdown', function (e) {
            flare = 1; rings.push({ x: e.clientX, y: e.clientY, t0: performance.now() });
            if (rings.length > 6) rings.shift();
        });
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function frame(t) {
            if (performance.now() - last > 4000) {
                tx = W / 2 + Math.cos(t / 2600) * W * .28;
                ty = H / 2 + Math.sin(t / 3300) * H * .25;
            }
            x += (tx - x) * .08; y += (ty - y) * .08;
            flare *= .94;
            var R = 380 + Math.sin(t / 1400) * 14 + flare * 420;

            torch.style.setProperty('--mx', x + 'px'); torch.style.setProperty('--my', y + 'px'); torch.style.setProperty('--r', R + 'px');
            if (ghost) ghost.style.transform = 'translate(' + (x - W / 2) * -.025 + 'px,' + (y - H / 2) * -.025 + 'px)';

            for (var k = 0; k < spans.length; k++) {
                var dx = centers[k][0] - x, dy = centers[k][1] - y, d = Math.sqrt(dx * dx + dy * dy);
                var o = Math.max(0, 1 - d / (R * .8)); o = o * o;
                spans[k].style.opacity = o * .85;
                spans[k].style.filter = 'blur(' + ((1 - o) * 3).toFixed(1) + 'px)';
                if (!spans[k].hasAttribute('data-fixed')) {
                    if (o > .08) vis[k] = true;
                    else if (o < .01 && vis[k]) { vis[k] = false; spans[k].textContent = pick(); centers[k] = center(spans[k]); }
                }
            }

            if (ctx) {
                ctx.clearRect(0, 0, W, H);
                for (var j = 0; j < dust.length; j++) {
                    var p = dust[j];
                    p.x += p.vx * 16; p.y += p.vy * 16;
                    if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
                    if (p.x < -.02) p.x = 1.02; if (p.x > 1.02) p.x = -.02;
                    var px = p.x * W, py = p.y * H, ddx = px - x, ddy = py - y, dd = Math.sqrt(ddx * ddx + ddy * ddy);
                    var al = Math.max(0, 1 - dd / R) * p.a;
                    if (al > .01) { ctx.fillStyle = 'rgba(255,255,255,' + al.toFixed(3) + ')'; ctx.beginPath(); ctx.arc(px, py, p.r, 0, 6.2832); ctx.fill(); }
                }
                var now = performance.now();
                rings = rings.filter(function (r) { return now - r.t0 < 1500; });
                rings.forEach(function (r) {
                    var a = (now - r.t0) / 1500, e = 1 - Math.pow(1 - a, 3);
                    ctx.strokeStyle = 'rgba(255,255,255,' + ((1 - a) * .45).toFixed(3) + ')'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(r.x, r.y, e * 560, 0, 6.2832); ctx.stroke();
                });
            }

            [plate, skills].forEach(function (pl) {
                if (pl && pl.offsetParent !== null) {
                    var r = pl.getBoundingClientRect();
                    pl.style.setProperty('--bx', (x - r.left) + 'px'); pl.style.setProperty('--by', (y - r.top) + 'px');

                    var vx = r.left + r.width / 2 - x, vy = r.top + r.height / 2 - y;
                    pl.style.setProperty('--sx', clamp(vx * .12, -80, 80) + 'px');
                    pl.style.setProperty('--sy', clamp(vy * .12, -80, 80) + 'px');
                }
            });

            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    })();
</script>
    <script>
    (function () {
        var screen = document.getElementById('start-screen'), intro = document.querySelector('.intro'), shade = document.querySelector('.intro-shade');
        if (!screen || !intro) return;
        var root = document.documentElement, W = innerWidth, H = innerHeight;
        var tx = W / 2, ty = H / 2, x = tx, y = ty, running = true, opened = false;
        screen.addEventListener('pointermove', function (e) { tx = e.clientX; ty = e.clientY; });
        function follow() {
            if (!running) return;
            x += (tx - x) * .1; y += (ty - y) * .1;
            root.style.setProperty('--ix', x + 'px'); root.style.setProperty('--iy', y + 'px');
            requestAnimationFrame(follow);
        }
        follow();
        screen.addEventListener('pointerdown', function (e) {
            if (opened) return;
            opened = true; running = false;
            if (shade) shade.remove();
            var cx = e.clientX, cy = e.clientY;
            var max = Math.sqrt(Math.pow(Math.max(cx, W - cx), 2) + Math.pow(Math.max(cy, H - cy), 2)) + 120;
            var t0 = performance.now(), dur = 1400;
            intro.style.background = '#000';
            intro.style.setProperty('--cx', cx + 'px'); intro.style.setProperty('--cy', cy + 'px');
            function step(now) {
                var p = Math.min(1, (now - t0) / dur);
                var e3 = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
                intro.style.setProperty('--ir', (e3 * max) + 'px');
                if (p < 1) requestAnimationFrame(step); else intro.remove();
            }
            requestAnimationFrame(step);
        });
    })();
    </script>
